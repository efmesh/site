<?xml version="1.0" encoding="UTF-8"?>
<!--
  EFMesh favicon — original artwork
  Concept (d): heart silhouette echoing the Electric Forest entrance arch,
  topped with a radio antenna emitting concentric mesh waves.
  Palette: deep purple (#5E35B1) + electric pink (#EC407A) + light green (#AEEA00)
  matches the site's Material theme (deep purple primary, light green accent)
  and the Electric Forest neon vibe.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#EC407A"/>
      <stop offset="100%" stop-color="#5E35B1"/>
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="65%">
      <stop offset="0%"  stop-color="#1A0033"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
  </defs>

  <!-- Dark festival-night background, rounded square -->
  <rect x="0" y="0" width="64" height="64" rx="12" ry="12" fill="url(#bgGrad)"/>

  <!-- Heart silhouette (Electric Forest arch echo) -->
  <path d="M32 54
           C 12 40, 6 26, 14 18
           C 20 12, 28 14, 32 22
           C 36 14, 44 12, 50 18
           C 58 26, 52 40, 32 54 Z"
        fill="url(#heartGrad)"
        stroke="#EC407A" stroke-width="0.5" stroke-opacity="0.6"/>

  <!-- Concentric mesh-radio waves emanating from antenna tip -->
  <g fill="none" stroke="#AEEA00" stroke-linecap="round" stroke-opacity="0.85">
    <path d="M28 8 Q32 4 36 8" stroke-width="1.5"/>
    <path d="M25 6 Q32 -1 39 6" stroke-width="1.2" stroke-opacity="0.55"/>
  </g>

  <!-- Antenna mast + base node -->
  <line x1="32" y1="14" x2="32" y2="10" stroke="#AEEA00" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="32" cy="10" r="2" fill="#AEEA00"/>
</svg>
